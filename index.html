<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <link rel="stylesheet" href="styles/style.css"/>
  <title>Hello, World!</title>
  <script type="module" src="scripts/example.js" defer></script>
</head>
<body>
    <h1>Custom Programming Language</h1>
  <br>
    <label for="message">Code:</label>
  <br>
    <textarea id="message" name="message" rows="20" cols="50" placeholder="Type your code here..."></textarea>
  <br>
    <button id="codesubmit">Submit code</button>
  <br>
  <textarea id="console" name="message" rows="5" cols="50" placeholder="Console"></textarea>
  <br>
  <textarea id="output" name="message" rows="20" cols="50" placeholder="Output goes here..."></textarea> 
    <script type="module" src="scripts/main.js"></script>
</body>
</html>
